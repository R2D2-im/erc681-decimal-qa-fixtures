<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ERC-681 缺省 decimal 测试</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f5f7fb; color: #182230; }
    main { width: min(720px, calc(100% - 32px)); margin: 32px auto; }
    .card { background: white; border-radius: 18px; padding: 24px; box-shadow: 0 8px 30px #14213d14; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .intro { margin: 0 0 22px; color: #52606d; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .wide { grid-column: 1 / -1; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #ccd4df; border-radius: 10px; padding: 11px 12px; font: inherit; }
    input:focus { outline: 2px solid #3861fb33; border-color: #3861fb; }
    button { margin-top: 18px; width: 100%; border: 0; border-radius: 11px; padding: 13px; color: white; background: #3861fb; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #274bd7; }
    #error { color: #b42318; margin-top: 12px; min-height: 20px; }
    #result { display: none; margin-top: 22px; border-top: 1px solid #e7ebf0; padding-top: 22px; }
    #qr { display: flex; justify-content: center; margin: 0 auto 18px; }
    #qr img, #qr canvas { max-width: 100%; height: auto !important; }
    .meta { background: #f6f8fa; border-radius: 10px; padding: 12px; margin-top: 10px; overflow-wrap: anywhere; }
    .meta strong { display: block; font-size: 12px; color: #667085; margin-bottom: 4px; }
    code { font-size: 13px; }
    .warning { color: #9a6700; font-size: 13px; line-height: 1.5; margin-top: 16px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>ERC-681 缺省 decimal 测试</h1>
      <p class="intro">生成 ERC-20 transfer 二维码。URI 只携带最小单位金额，不包含 <code>decimal</code> 参数，用于验证钱包是否采用本地代币精度。</p>
      <div class="grid">
        <div>
          <label for="chainId">Chain ID</label>
          <input id="chainId" inputmode="numeric" value="1" placeholder="例如 1">
        </div>
        <div>
          <label for="decimals">本地代币精度</label>
          <input id="decimals" inputmode="numeric" value="6" placeholder="6">
        </div>
        <div class="wide">
          <label for="token">Token 合约地址</label>
          <input id="token" value="0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" placeholder="0x…">
        </div>
        <div class="wide">
          <label for="recipient">收款地址</label>
          <input id="recipient" placeholder="0x…">
        </div>
        <div>
          <label for="amount">显示金额</label>
          <input id="amount" inputmode="decimal" value="1.23" placeholder="1.23">
        </div>
      </div>
      <button id="generate">生成测试二维码</button>
      <div id="error" role="alert"></div>
      <div id="result">
        <div id="qr"></div>
        <div class="meta"><strong>最小单位金额（uint256）</strong><code id="units"></code></div>
        <div class="meta"><strong>ERC-681 URI（无 decimal 参数）</strong><code id="uri"></code></div>
        <p class="warning">仅用于 QA 测试。请核对网络、Token 和收款地址，不要提交真实资产转账。</p>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const addressPattern = /^0x[0-9a-fA-F]{40}$/;

    function toBaseUnits(value, decimals) {
      if (!/^(?:0|[1-9]\d*)(?:\.\d+)?$/.test(value)) throw new Error('金额格式不正确');
      const [whole, fraction = ''] = value.split('.');
      if (fraction.length > decimals) throw new Error(`金额最多支持 ${decimals} 位小数`);
      return BigInt(whole + fraction.padEnd(decimals, '0')).toString();
    }

    $('generate').addEventListener('click', async () => {
      $('error').textContent = '';
      $('result').style.display = 'none';
      try {
        const chainId = $('chainId').value.trim();
        const decimals = Number($('decimals').value.trim());
        const token = $('token').value.trim();
        const recipient = $('recipient').value.trim();
        const amount = $('amount').value.trim();
        if (!/^\d+$/.test(chainId) || BigInt(chainId) < 1n) throw new Error('Chain ID 不正确');
        if (!Number.isInteger(decimals) || decimals < 0 || decimals > 255) throw new Error('代币精度须为 0–255 的整数');
        if (!addressPattern.test(token)) throw new Error('Token 合约地址不正确');
        if (!addressPattern.test(recipient)) throw new Error('收款地址不正确');
        const units = toBaseUnits(amount, decimals);
        const uri = `ethereum:${token}@${chainId}/transfer?address=${recipient}&uint256=${units}`;
        if (new URLSearchParams(uri.split('?')[1]).has('decimal')) throw new Error('URI 意外包含 decimal 参数');
        $('units').textContent = units;
        $('uri').textContent = uri;
        $('qr').replaceChildren();
        new QRCode($('qr'), { text: uri, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
        $('result').style.display = 'block';
      } catch (error) {
        $('error').textContent = error.message || String(error);
      }
    });
  </script>
</body>
</html>
